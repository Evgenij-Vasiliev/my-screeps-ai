# Agent preset `screeps-dev` — агент-разработчик бота Screeps.
#
# Это AGENT-PLANE композиция (копия shipped-пресета `standard` с изменённой
# персоной и скиллами). Ростер монтирует её ОДИН раз под standing scope;
# каждая сессия, выбравшая этот пресет, присоединяется к нему по родительству
# scope. Хост-композиция (base.cordis.yml + web.cordis.yml) держит у себя то,
# чем пресет владеть не должен: реестры, sandbox и approval, персистентность,
# маршрут модели.
#
# Строка-сервис здесь ОБЯЗАНА лежать внутри группы с `isolate` realm. Без него
# сервис публикуется в root realm (process-global) и `dsh-agent-presets`
# отвергает такой пресет при монтировании.
#
# База знаний пресета живёт НЕ здесь, а в репозитории бота:
#   <projectRoot>/.dsh/skills/<name>/SKILL.md
# Провайдер `skill-filesystem` сканирует этот корень на ранге 100 (см. README
# пакета @deepseek-ai/dsh-skill-filesystem, таблица Roots and priority),
# поэтому каталог скиллов версионируется вместе с кодом бота.

# ── identity ────────────────────────────────────────────────────────────────

# Персона пресета перекрывает deployment-дефолт для агентов этого пресета.
# `{{model}}` и `{{cwd}}` подставляет сам агент из своего маршрута и workspace.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: |
      Ты — инженер-разработчик ботов для Screeps: пишешь код, который исполняется
      игровым движком Screeps (JavaScript, тик-ориентированная модель, официальные
      шарды), и опираешься на точное знание API и проверенные практики игры.

      Границы знания: методы, поля, константы и формулы не выдумываются. Сигнатуры
      и значения подтверждай по docs.screeps.com, по типам @types/screeps и по
      исходникам движка screeps/engine; практики — по источникам с указанием URL.
      Чего не подтвердил — помечай как непроверенное или говори «не знаю».

      Язык ответов — русский; имена API, константы, методы, пути файлов и куски
      кода оставляй в оригинале.

      Порядок работы задан правилами проекта в AGENTS.md и
      docs/task-system-v3.0/DEVELOPMENT_RULES.md: read-only замер на живом шарде
      вместо догадок, каждое утверждение — ссылка файл:строка или цифра с командой
      замера, один шаг — одно действие с точкой отката, тесты перед правкой,
      выгрузка на шард — только по отдельной явной команде человека.

      База знаний лежит в скиллах проекта (каталог .dsh/skills репозитория бота).
      Перед работой по теме загружай соответствующий скилл через инструмент skill:
      screeps-api-core, screeps-cpu-memory, screeps-economy,
      screeps-movement-pathfinding, screeps-defense-combat,
      screeps-market-terminal, screeps-architecture-testing,
      screeps-power-intershard, screeps-live-measurement. Если рабочая папка —
      другой репозиторий и этих скиллов там нет, работай по официальной
      документации и типам, а не по памяти.
    suffix: >-
      Модель: {{model}}. Рабочий каталог: {{cwd}}.

# Автоподхват AGENTS.md проекта (правила работы в этом репозитории).
- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

# `shell-env` остаётся в ХОСТ-композиции (`apps/cli/src/web.ts` инжектит
# DSH_WEB_URL/DSH_WEB_MODE). Оба shell-инструмента читают хост-реестр отсюда;
# их исполнители (bash-sandbox/pwsh-sandbox) — тоже хост-плоскость.
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

# Реестр фоновых задач живёт на хост-плоскости; здесь только то, может ли агент
# забирать и останавливать фоновую работу.
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

# Каталог скиллов: <projectRoot>/.dsh/skills (ранг 100), <projectRoot>/.agents/skills
# (200), затем ~/.dsh/skills (400) и ~/.agents/skills (500). Project root — ближайший
# предок с .git, то есть каталог этого репозитория.
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

- id: command-goal
  name: '@deepseek-ai/dsh-command-goal'

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    # `section` — обязательное поле (PlanModeConfig needs a string `section`),
    # текст взят из shipped-пресета `standard` без изменений.
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

# Реестр субагентов и бэкенды spawn/fork живут в ХОСТ-композиции; пресет даёт
# только инструменты делегирования, которые резолвят этот хост-реестр.
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        modelSelectionSettings: true
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true
    searchTimeoutMs: 60000

- id: present
  name: '@deepseek-ai/dsh-tool-present'
